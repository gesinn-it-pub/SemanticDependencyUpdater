name: CI

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**/*.adoc'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**/*.adoc'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      matrix:
        include:
          - mediawiki_version: '1.43'
            smw_version: 6.0.1
            php_version: 8.2
            database_type: mysql
            database_image: "mariadb:11.2"
            coverage: false
            experimental: false
          - mediawiki_version: '1.43'
            smw_version: 7.2.0
            php_version: 8.2
            database_type: mysql
            database_image: "mariadb:11.2"
            coverage: true
            experimental: false
          - mediawiki_version: '1.46'
            smw_version: 7.2.0
            php_version: 8.4
            database_type: mysql
            database_image: "mariadb:11.2"
            coverage: false
            experimental: true

    env:
      MW_VERSION: ${{ matrix.mediawiki_version }}
      SMW_VERSION: ${{ matrix.smw_version }}
      PHP_VERSION: ${{ matrix.php_version }}
      DB_TYPE: ${{ matrix.database_type }}
      DB_IMAGE: ${{ matrix.database_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Run tests
        run: make ci
        if: matrix.coverage == false

      - name: Run tests with coverage
        run: mkdir -p build/coverage && make ci-coverage
        if: matrix.coverage == true

      - name: Run Phan
        if: matrix.coverage == true
        run: make composer-phan
        env:
          MW_VERSION: ${{ matrix.mediawiki_version }}
          PHP_VERSION: ${{ matrix.php_version }}

      - name: Upload code coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: gesinn-it-pub/SemanticDependencyUpdater
          files: build/coverage/php/coverage.xml
          disable_search: true
        if: matrix.coverage == true
